{% load static %}
<!doctype html>
<html lang="vi">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width,initial-scale=1"/>
    <title>Change password after verify</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
    body {
        margin: 0;
        padding: 0;
        background: url("{% static 'accounts/background.jpeg' %}") no-repeat center center fixed;
        background-size: cover;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    }

    /* FORM BOX */
    .login-wrapper {
        width: 100%;
        display: flex;
        justify-content: center;
        padding-top: 60px;
    }

    .login-box {
        width: 380px;
        background: #fff;
        border-radius: 10px;
        padding: 40px 35px;
        box-shadow: 0 4px 25px rgba(0,0,0,0.08);
        text-align: center;
    }

    /* LOGO + TITLE */
    .logo-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin-bottom: 15px;
    }

    .logo-row img {
        width: 48px;
    }

    .logo-text {
        font-size: 28px;
        font-weight: 600;
        color: #1f2937;
    }

    h2 {
        margin-top: 20px;
        margin-bottom: 25px;
        font-size: 16px;
        font-weight: 700;
        color: #111;
    }

    h3 {
        margin-top: -20px;
        margin-bottom: -10px;
        font-size: 16px;
        text-align: left;
        color : #3b4048;
    }

    p {
        margin-top: 20px;
        margin-bottom: 25px;
        font-size: 15px;
        text-align: left;
    }

    a {
        color: #0065ff;
    }

    /* INPUT */
    label {
        display: block;
        text-align: left;
        font-size: 14px;
        font-weight: 600;
        margin-bottom: 6px;
        color: #111;
    }

    .otp-container {
        display: flex;
        gap: 10px;
    }

    .otp-input {
        width: 45px;
        height: 45px;
        font-size: 24px;
        text-align: center;
        border: 2px solid #ccc;
        border-radius: 6px;
    }

     /* BUTTON Continue */
    .btn-primary {
        width: 100%;
        padding: 12px;
        margin-top: 18px;
        background: #0065ff;
        border-radius: 4px;
        border: none;
        color: #fff;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
    }

    .bottom-links {
        margin-top: 20px;
        font-size: 14px;
    }

    .bottom-links a {
        color: #0065ff;
        text-decoration: none;
        margin: 0 5px;
    }

    /* Khu vực điều khoản */
    .extra-links {
        margin-top: 25px;
        text-align: center;
        font-size: 13px;
        color: #6b778c;
    }

    .extra-links img{
        width: 200px;
        height: 70px;
        margin-bottom: -15px;
        margin-top: -25px;
    }

    /* Gạch ngang */
    .separator {
        width: 100%;
        height: 1px;
        background-color: #dfe1e6;
        margin-bottom: 18px;
    }

    /* Dòng recaptcha */
    .recaptcha-text {
        width: 90%;
        margin: 0 auto;
        line-height: 1.5;
    }

    .recaptcha-text div {
        margin-bottom: 10px;
    }

    .recaptcha-text a {
        color: #0065ff;
    }

    input[type="password"] {
        width: 93%;
        padding: 11px 12px;
        border: 1px solid #d3d3d3;
        border-radius: 4px;
        font-size: 15px;
    }

</style>
</head>
<body>

<div class="login-wrapper">
    <div class="login-box">

        <!-- LOGO -->
        <div class="logo-row">
            <img src="{% static 'accounts/logo.png' %}" alt="Logo">
            <div class="logo-text">TodoList</div>
        </div>


        <!-- TITLE -->
        <h2>Đổi mật khẩu</h2>

        <form method="POST">
            {% csrf_token %}

            <label>Mật khẩu mới</label>
            <input type="password" name="password1" placeholder="Nhập mật khẩu mới" required>

            <label style="margin-top: 10px">Xác thực mật khẩu mới</label>
            <input type="password" name="password2" placeholder="Nhập lại mật khẩu mới" required>

            {% if message %}
                <div style="margin-top: 15px; margin-bottom: 10px; text-align: center;
                            color: {% if is_success %}green{% else %}red{% endif %}; font-weight: bold;">
                    {{ message }}
                </div>
            {% endif %}

            {% if is_success %}
                <a href="{% url 'sign_in' %}" class="btn-primary" style="text-decoration: none; display: block; text-align: center; line-height: 40px;">Về trang đăng nhập</a>
            {% else %}
                <button type="submit" class="btn-primary">Đổi mật khẩu</button>
            {% endif %}
        </form>

        <div class="extra-links">
            <div class="separator"></div>

            <img src="{% static 'accounts/logo_alassian.png' %}"/>

            <div class="recaptcha-text">
                <div >Một tài khoản cho Trello, Jira, Confluence và
                <a href="https://support.atlassian.com/atlassian-account/docs/what-is-an-atlassian-account/">các sản phẩm khác.</a>
                </div>

                <div><a href="https://support.atlassian.com/atlassian-account/docs/troubleshoot-login-issues-with-your-atlassian-account/">Hỗ trợ đăng nhập</a>
                    <span>•</span>
                    <a href="https://support.atlassian.com/">Liên hệ giúp đỡ</a>
                </div>

            </div>
        </div>

    </div>
</div>

</body>
</html>
