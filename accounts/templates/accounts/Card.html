<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="stylesheets/font-awesome.css" rel="stylesheet">
    <link rel="shortcut icon" href="images/favicon.ico">
    <link rel="apple-touch-icon" href="images/apple-touch-icon.png">
    <link rel="apple-touch-icon" sizes="72x72" href="images/apple-touch-icon-72x72.png">
    <link rel="apple-touch-icon" sizes="114x114" href="images/apple-touch-icon-114x114.png">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href='https://fonts.googleapis.com/css?family=Roboto Condensed' rel='stylesheet'>
    <link href='https://fonts.googleapis.com/css?family=Roboto' rel='stylesheet'>
    <link rel="icon" href="image/Screenshot%20From%202025-11-26%2010-49-26.png" type="image/x-icon">
    <title>Action</title>
    <style>
        body {
            margin: 0px;
            padding: 0px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            height: 100%;
            color: #75777d;

        }

        body a {
            text-decoration: none;
        }

        .div_toal {
            position: relative;
            height: 100vh;
            display: flex;
        }

        .d_bar {
            background-color: #18191a;
            color: white;
        }

        .d_bar a {
            color: white;
        }

        .section_bar {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 20px;
            gap: 10px;
            font-size: 14px;
            font-family: Arial, Helvetica, sans-serif;
            width: 100%;

        }

        .options {
            display: flex;
            flex-direction: column;
            padding-left: 0px;
        }

        .options li {
            list-style: none;
            padding-bottom: 5px;
            padding-top: 5px;
            margin-bottom: 10px;
            padding-left:10px;
        }

        .line {
            width: 70%;
            margin-top: 20px;
            margin-bottom: 20px;
        }

        .infor {
            background-color: #1f1f21;
            color: #75777d;
            width: 100%;
        }

        .infor_personal {
            margin: auto;
            width: 530px;
            margin-left: 25%;
        }

        .infor_personal p {
            margin-bottom: 0px;
            margin-top: 10px;
        }

        .x {
            font-size: 30px;
            cursor: pointer;
            top: 1px;
            right: 10px;
            position: absolute;
            color: #75777d;
            cursor: pointer;
            padding-left:5px;
        }

        @media (max-width: 800px) {
            .x {
                position: absolute;
                right: 10px;
            }

            .section_bar {
                width: 100%;
            }

            .div_toal {
                position: relative;
            }

            .img_infor {
                width: 5px;
            }

            .h5_setting {
                font-size: 10px;
                color: orange;
            }
        }

        .mucchon {
            color: #0079BF;
            background-color: #1C2B42;
            border-radius: 5px;
            border: solid 1px;

        }
    </style>
</head>
<body>

<div class="div_toal">
    <div class="col-xl-2 col-md-6 col-sm-12 col-12 d_bar">
                <section class="section_bar">
            <div class="setting_personal">
                <h5 class="h5_setting">THÔNG TIN CÁ NHÂN</h5>
                <ul class="options">
                    <form action="SitePersonal.html" method="get">
                    <li ><a href="{% url 'sitepersonal' %}"><i class="fa-regular fa-user"></i> Hồ sơ và hiển thị</a></li>
                    </form>
                    <form action="setting.html" method="get">
                    <li><a href="{% url 'setting'%}"><i class="fa-sharp fa-solid fa-gear"></i>  Cài đặt</a></li>
                    </form>
                    <form action="hoatdong.html" method="get">
                    <li ><a href="{% url 'action'%}"><i class="fa-solid fa-list"></i>  Hoạt động</a></li>
                    </form>
                    <form action="Card.html" method="get">
                    <li class="mucchon" ><a href="{% url 'cards'%}"><i class="fa-solid fa-credit-card"></i> Thẻ</a></li>
                    </form>
                </ul>
            </div>
            <hr class="line">
            <div class="work_space">
                <h5 class="h5_setting">KHÔNG GIAN LÀM VIỆC</h5>
                <ul class="options">
                    <form action="boards.html" method="get">
                    <li><a href="{%url 'boards' %}"><i class="fa-solid fa-clipboard-list"></i> Bảng</a></li>
                    </form>
                    <form action="members.html" method="get">
                    <li><a href="{%url 'members'%}"><i class="fa-solid fa-users"></i> Thành viên</a></li>
                    </form>
                </ul>
            </div>
        </section>
    </div>
    <div class="col-xl-10 col-md-6 col-sm-12 col-12 infor">
        <div class="infor_personal" id="fileanddisplay">
        </div>
        <div class="x">
            <p class="x">&#10005</p>
        </div>
    </div>
</div>
<script>

</script>
</body>

</html>
