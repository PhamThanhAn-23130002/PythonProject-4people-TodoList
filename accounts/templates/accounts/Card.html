<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="stylesheets/font-awesome.css" rel="stylesheet">
    <link rel="shortcut icon" href="images/favicon.ico">
    <link rel="apple-touch-icon" href="images/apple-touch-icon.png">
    <link rel="apple-touch-icon" sizes="72x72" href="images/apple-touch-icon-72x72.png">
    <link rel="apple-touch-icon" sizes="114x114" href="images/apple-touch-icon-114x114.png">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>

    <title>Action</title>
    <style>
        body {
            margin: 0px;
            padding: 0px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            height: 100%;
            color: #75777d;

        }

        body a {
            text-decoration: none;
        }

        .div_toal {
            position: relative;
            height: 100vh;
            display: flex;
        }

        .d_bar {
            background-color: #18191a;
            color: white;
        }

        .d_bar a {
            color: white;
        }

        .section_bar {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 20px;
            gap: 10px;
            font-size: 14px;
            font-family: Arial, Helvetica, sans-serif;
            width: 100%;

        }

        .options {
            display: flex;
            flex-direction: column;
            padding-left: 0px;
        }

        .options li {
            list-style: none;
            padding-bottom: 5px;
            padding-top: 5px;
            margin-bottom: 10px;
            padding-left:10px;
        }

        .line {
            width: 70%;
            margin-top: 20px;
            margin-bottom: 20px;
        }

        .infor {
            background-color: #1f1f21;
            color: #75777d;
            width: 100%;
        }


        .x {
            font-size: 30px;
            cursor: pointer;
            top: 1px;
            right: 10px;
            position: absolute;
            color: #75777d;
            cursor: pointer;
            padding-left:5px;
        }

        @media (max-width: 800px) {
            .x {
                position: absolute;
                right: 10px;
            }

            .section_bar {
                width: 100%;
            }

            .div_toal {
                position: relative;
            }

            .img_infor {
                width: 5px;
            }

            .h5_setting {
                font-size: 10px;
                color: orange;
            }
        }

        .mucchon {
            color: #0079BF;
            background-color: #1C2B42;
            border-radius: 5px;
            border: solid 1px;

        }
    .infor_personal {
    width: 90% !important; 
    max-width: 1000px;
    margin-left:60px;
    margin-right: auto;
    padding-top: 20px;
}

.cards-interface {
    color: #b6c2cf;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
}

.page-title {
    color: #b6c2cf;
    margin-bottom: 20px;
    font-size: 20px;
    font-weight: 600;
}

/* Toolbar Lọc */
.filter-toolbar {
    display: flex;
    justify-content: flex-end;
    align-items: center;
    gap: 10px;
    margin-bottom: 20px;
}

.sort-dropdown {
    background-color: transparent;
    color: #b6c2cf;
    padding: 6px 12px;
    border-radius: 3px;
    cursor: pointer;
    font-size: 14px;
}
.sort-dropdown:hover {
    background-color: #333c43;
}

.btn-filter {
    background-color: transparent;
    border: 1px solid #b6c2cf; /* Màu viền nút */
    color: #b6c2cf;
    padding: 6px 12px;
    border-radius: 3px;
    font-size: 14px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 5px;
}
.btn-filter:hover {
    background-color: #333c43;
}

.btn-clear-filter {
    background: none;
    border: none;
    color: #9fadbc;
    font-size: 14px;
    cursor: pointer;
    text-decoration: underline;
}

/* Table Custom Styles */
.table-dark-custom {
    width: 100%;
    border-collapse: collapse;
    color: #b6c2cf;
}

.table-dark-custom thead th {
    text-align: left;
    font-size: 12px;
    font-weight: 600;
    color: #9fadbc;
    border-bottom: 1px solid #738496;
    padding: 8px;
}

.table-dark-custom tbody td {
    padding: 12px 8px;
    border-bottom: 1px solid #384148;
    vertical-align: middle;
    font-size: 14px;
}

.table-dark-custom tbody tr:hover {
    background-color: #2c333a;
}

/* Board Info Column */
.board-info {
    display: flex;
    align-items: center;
    gap: 10px;
}

.board-thumb {
    width: 32px;
    height: 32px;
    background-color: #9fadbc; /* Giả lập ảnh board */
    border-radius: 4px;
}

.board-text {
    display: flex;
    flex-direction: column;
}

.board-name {
    font-weight: bold;
    color: #b6c2cf;
    font-size: 14px;
}

.workspace-name {
    font-size: 12px;
    color: #9fadbc;
}
.cards-interface{
     background-color: #1f1f21;
}
.table-responsive{
    background-color: #1f1f21;
    color: #9fadbc;
}
.table-dark-custom{
--bs-table-bg: transparent;       
    --bs-table-color: #b6c2cf;        
}
    </style>
</head>

        <div class="table-responsive">
