{% load static %}
<!doctype html>
<html lang="vi">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width,initial-scale=1"/>
    <title>Reset password</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
    body {
        margin: 0;
        padding: 0;
        background: url("{% static 'accounts/background.jpeg' %}") no-repeat center center fixed;
        background-size: cover;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    }

    /* FORM BOX */
    .login-wrapper {
        width: 100%;
        display: flex;
        justify-content: center;
        padding-top: 60px;
    }

    .login-box {
        width: 380px;
        background: #fff;
        border-radius: 10px;
        padding: 40px 35px;
        box-shadow: 0 4px 25px rgba(0,0,0,0.08);
        text-align: center;
    }

    /* LOGO + TITLE */
    .logo-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin-bottom: 15px;
    }

    .logo-row img {
        width: 48px;
    }

    .logo-text {
        font-size: 28px;
        font-weight: 600;
        color: #1f2937;
    }

    h2 {
        margin-top: 20px;
        margin-bottom: 25px;
        font-size: 16px;
        font-weight: 600;
        color: #111;
    }

    /* INPUT */
    label {
        display: block;
        text-align: left;
        font-size: 14px;
        font-weight: 600;
        margin-bottom: 6px;
        color: #111;
    }

    input[type="email"] {
        width: 93%;
        padding: 11px 12px;
        border: 1px solid #d3d3d3;
        border-radius: 4px;
        font-size: 15px;
        margin-bottom: 5px;
    }

    /* BUTTON Continue */
    .btn-primary {
        width: 100%;
        padding: 12px;
        margin-top: 18px;
        background: #0065ff;
        border-radius: 4px;
        border: none;
        color: #fff;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
    }

    .btn-primary:hover {
        background: #0052d6;
    }

    .bottom-links {
        margin-top: 20px;
        font-size: 14px;
    }

    .bottom-links a {
        color: #0065ff;
        text-decoration: none;
        margin: 0 5px;
    }

    /* Khu vực điều khoản */
    .extra-links {
        margin-top: 25px;
        text-align: center;
        font-size: 13px;
        color: #6b778c;
    }

    .extra-links img{
        width: 200px;
        height: 70px;
        margin-bottom: -15px;
        margin-top: -25px;
    }

    /* Gạch ngang */
    .separator {
        width: 100%;
        height: 1px;
        background-color: #dfe1e6;
        margin-bottom: 18px;
    }

    /* Dòng recaptcha */
    .recaptcha-text {
        width: 90%;
        margin: 0 auto;
        line-height: 1.5;
    }

    .recaptcha-text div {
        margin-bottom: 10px;
    }

    .recaptcha-text a {
        color: #0065ff;
    }

</style>
</head>
<body>

<div class="login-wrapper">
    <div class="login-box">

        <!-- LOGO -->
        <div class="logo-row">
            <img src="{% static 'accounts/logo.png' %}" alt="Logo">
            <div class="logo-text">TodoList</div>
        </div>


        <!-- TITLE -->
        <h2>Can't log in?</h2>

        <!-- EMAIL INPUT -->
        <div class="input-area">
            <label>We'll send a recovery link to</label>
            <input type="email" id="emailInput" placeholder="Enter email">
        </div>

        <!-- CONTINUE BUTTON -->
        <button class="btn-primary"  onclick="window.location.href='{% url 'verify_acc' %}'">Send recovery link</button>

        <!-- BOTTOM LINKS -->
        <div class="bottom-links">
            <a href='{% url 'sign_in' %}'>Return to log in</a>
        </div>

        <div class="extra-links">
            <div class="separator"></div>

            <img src="{% static 'accounts/logo_alassian.png' %}"/>

            <div class="recaptcha-text">
                <div >One account for Trello, Jira, Confluence and
                <a href="https://support.atlassian.com/atlassian-account/docs/what-is-an-atlassian-account/">more.</a>
                </div>

                <div><a href="https://support.atlassian.com/atlassian-account/docs/troubleshoot-login-issues-with-your-atlassian-account/">Login help</a>
                    <span>•</span>
                    <a href="https://support.atlassian.com/">Contact support</a>
                </div>

            </div>
        </div>

    </div>
</div>

<script>
function goFinishReset() {
    const email = document.getElementById("emailInput").value;
    window.location.href = `finishResetPassword.html?email=${encodeURIComponent(email)}`;
}
</script>

</body>
</html>
