<!doctype html>
<html lang="vi">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width,initial-scale=1"/>
    <title>Verify</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
    body {
        margin: 0;
        padding: 0;
        background: url('image/background.jpeg') no-repeat center center fixed;
        background-size: cover;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    }

    /* FORM BOX */
    .login-wrapper {
        width: 100%;
        display: flex;
        justify-content: center;
        padding-top: 60px;
    }

    .login-box {
        width: 380px;
        background: #fff;
        border-radius: 10px;
        padding: 40px 35px;
        box-shadow: 0 4px 25px rgba(0,0,0,0.08);
        text-align: center;
    }

    /* LOGO + TITLE */
    .logo-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin-bottom: 15px;
    }

    .logo-row img {
        width: 48px;
    }

    .logo-text {
        font-size: 28px;
        font-weight: 600;
        color: #1f2937;
    }

    h2 {
        margin-top: 20px;
        margin-bottom: 25px;
        font-size: 25px;
        font-weight: 650;
        color: #111;
    }

    h3 {
        margin-top: -20px;
        margin-bottom: 25px;
        font-size: 16px;
        text-align: left;
        color : #3b4048;
    }

    p {
        margin-top: 20px;
        margin-bottom: 25px;
        font-size: 16px;
        text-align: left;
    }

    .otp-container {
        display: flex;
        gap: 10px;
    }

    .otp-input {
        width: 45px;
        height: 45px;
        font-size: 24px;
        text-align: center;
        border: 2px solid #ccc;
        border-radius: 6px;
    }

    /* BUTTON Continue */
    .btn-primary {
        width: 100%;
        padding: 12px;
        margin-top: 18px;
        background: #0065ff;
        border-radius: 4px;
        border: none;
        color: #fff;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
    }

    .btn-primary:hover {
        background: #0052d6;
    }

    .line-text {
        margin: 18px 0;
        color: #666;
        font-size: 14px;
        font-weight: 500;
    }

    /* OAuth Buttons */
    .oauth-btn {
        width: 100%;
        padding: 12px;
        border: 1px solid #d6d6d6;
        background: #fafafa;
        border-radius: 4px;
        margin-bottom: 10px;
        cursor: pointer;
        font-size: 15px;
        font-weight: 500;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
    }

    .oauth-btn:hover {
       box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
    }

    .bottom-links {
        margin-top: 20px;
        font-size: 14px;
    }

    .bottom-links a {
        color: #0065ff;
        text-decoration: none;
        margin: 0 5px;
    }

    /* Khu vực điều khoản */
    .extra-links {
        margin-top: 25px;
        text-align: center;
        font-size: 13px;
        color: #6b778c;
    }

    .extra-links img{
        width: 200px;
        height: 70px;
        margin-bottom: -15px;
        margin-top: -25px;
    }

    /* Gạch ngang */
    .separator {
        width: 100%;
        height: 1px;
        background-color: #dfe1e6;
        margin-bottom: 18px;
    }

    /* Dòng recaptcha */
    .recaptcha-text {
        width: 90%;
        margin: 0 auto;
        line-height: 1.5;
    }

    .recaptcha-text a {
        color: #0065ff;
    }

</style>
</head>
<body>

<div class="login-wrapper">
    <div class="login-box">

        <!-- LOGO -->
        <div class="logo-row">
            <img src="image/logo.png" alt="Logo">
            <div class="logo-text">TodoList</div>
        </div>


        <!-- TITLE -->
        <h2>We've emailed you a code</h2>

        <p>To complete your account setup, enter the code we've sent to:</p>

        <h3 id="emailDisplay"></h3>

        <div class="otp-container">
            <input type="text" maxlength="1" class="otp-input">
            <input type="text" maxlength="1" class="otp-input">
            <input type="text" maxlength="1" class="otp-input">
            <input type="text" maxlength="1" class="otp-input">
            <input type="text" maxlength="1" class="otp-input">
            <input type="text" maxlength="1" class="otp-input">
        </div>

        <!-- CONTINUE BUTTON -->
        <button class="btn-primary" onclick="window.location.href='{% url 'create_name_pass' %}'">Verify</button>

        <!-- BOTTOM LINKS -->
        <div class="bottom-links">
            <a href="">Didn't receive an email? Resend email</a>
        </div>

        <div class="extra-links">
            <div class="separator"></div>

            <img src="image/logo_alassian.png"/>

            <div class="recaptcha-text">
                One account for Trello, Jira, Confluence and
                <a href="https://support.atlassian.com/atlassian-account/docs/what-is-an-atlassian-account/">more.</a>
            </div>
        </div>

    </div>
</div>

<script>
const params = new URLSearchParams(window.location.search);
document.getElementById("emailDisplay").innerText = params.get("email");
</script>

<script>
const inputs = document.querySelectorAll(".otp-input");

inputs.forEach((input, index) => {
input.addEventListener("input", () => {
    if (input.value.length === 1 && index < inputs.length - 1) {
        inputs[index + 1].focus();
    }
});

input.addEventListener("keydown", (e) => {
    if (e.key === "Backspace" && index > 0 && !input.value) {
        inputs[index - 1].focus();
    }
});
});
</script>

<script>
function goToFinish() {
    const email = new URLSearchParams(window.location.search).get("email");
    window.location.href = `finishSettingUpAccount.html?email=${encodeURIComponent(email)}`;
}
</script>

</body>
</html>
