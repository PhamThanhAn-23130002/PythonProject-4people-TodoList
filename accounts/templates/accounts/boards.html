<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="stylesheets/font-awesome.css" rel="stylesheet">
    <link rel="shortcut icon" href="images/favicon.ico">
    <link rel="apple-touch-icon" href="images/apple-touch-icon.png">
    <link rel="apple-touch-icon" sizes="72x72" href="images/apple-touch-icon-72x72.png">
    <link rel="apple-touch-icon" sizes="114x114" href="images/apple-touch-icon-114x114.png">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href='https://fonts.googleapis.com/css?family=Roboto Condensed' rel='stylesheet'>
    <link href='https://fonts.googleapis.com/css?family=Roboto' rel='stylesheet'>
    <link rel="icon" href="image/Screenshot%20From%202025-11-26%2010-49-26.png" type="image/x-icon">
    <title>Action</title>
    <style>
        body {
            background-color: #1e1e1e;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            color: #ffffff;
            overflow-x: hidden;
        }

        body a {
            text-decoration: none;
        }

        .div_toal {
            position: relative;
            height: 100vh;
            display: flex;
        }

        .d_bar {
            background-color: #18191a;
            color: white;
        }

        .d_bar a {
            color: white;
        }

        .section_bar {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 20px;
            gap: 10px;
            font-size: 14px;
            font-family: Arial, Helvetica, sans-serif;
            width: 100%;

        }

        .options {
            display: flex;
            flex-direction: column;
            padding-left: 0px;
        }

        .options li {
            list-style: none;
            padding-bottom: 5px;
            padding-top: 5px;
            margin-bottom: 10px;
            padding-left:10px;
        }

        .line {
            width: 70%;
            margin-top: 20px;
            margin-bottom: 20px;
        }

        .infor {
            background-color: #1f1f21;
            color: #75777d;
            width: 100%;
        }

        .infor_personal {
            margin: auto;
            padding-top:48px;
            padding-left:30px
        }

        .infor_personal p {
            margin-bottom: 0px;
            margin-top: 10px;
        }

        .x {
            font-size: 30px;
            cursor: pointer;
            top: 1px;
            right: 10px;
            position: absolute;
            color: #75777d;
            cursor: pointer;
            padding-left:5px;
        }
        @media (max-width: 800px) {
            .x {
                position: absolute;
                right: 10px;
            }

            .section_bar {
                width: 100%;
            }

            .div_toal {
                position: relative;
            }
            .h5_setting {
                font-size: 10px;
                color: orange;
            }
        }

        .mucchon {
            color: #0079BF;
            background-color: #1C2B42;
            border-radius: 5px;
            border: solid 1px;

        }
        .seach{
            display: flex;
            justify-content: left;
            gap: 10px;
        }
        .h1bang{
            font-size: 20px;
        }
        .iseach{
            box-sizing: border-box;
            position: relative;
            align-items: center;
            display: flex;
            flex-wrap: wrap;
            background-color: rgb(36 37 40);
            border: solid white 1px;
            border-radius: 5px;
            color:white;
            width: 200px;
            height:40px;
        }

        .card-list {
    display: flex;
    gap: 20px;
    flex-wrap: wrap;
    margin-top: 20px;
}

.card-item {
    width: 220px;
    border-radius: 14px;
    overflow: hidden;
    background: #1f1f21;
    text-decoration: none;
    color: white;

    box-shadow: 0 4px 8px rgba(0,0,0,.35);
    transition: transform .2s ease, box-shadow .2s ease;
}

.card-item:hover {
    transform: translateY(-6px);
    box-shadow: 0 10px 20px rgba(0,0,0,.5);
}

/* ảnh phía trên */
.card-cover {
    height: 90px;
    background-size: cover;
    background-position: center;
}

/* tên card phía dưới */
.card-title {
    padding: 10px 12px;
    font-size: 14px;
    font-weight: 600;
    background: #1f1f21;
}

/* card tạo mới */
.card-create {
    display: flex;
    align-items: center;
    justify-content: center;
    height: 120px;
    background: #2b2c2f;
    color: #aaa;
    font-weight: 600;
    cursor: pointer;
}
    </style>
</head>

                    <form action="Card.html" method="get">

        </section>
    </div>

                <div id="seachforname" >

                <input class="iseach"  type="text" placeholder="tìm kiếm tên bảng...">

            </div>
            <div  style="display: flex; gap: 20px; margin-top: 20px;">
