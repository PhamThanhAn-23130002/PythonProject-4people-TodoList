<!doctype html>
<html lang="vi">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width,initial-scale=1"/>
    <title>Finish reset password</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
    body {
        margin: 0;
        padding: 0;
        background: url('image/background.jpeg') no-repeat center center fixed;
        background-size: cover;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    }

    /* FORM BOX */
    .login-wrapper {
        width: 100%;
        display: flex;
        justify-content: center;
        padding-top: 60px;
    }

    .login-box {
        width: 380px;
        background: #fff;
        border-radius: 10px;
        padding: 40px 35px;
        box-shadow: 0 4px 25px rgba(0,0,0,0.08);
        text-align: center;
    }

    /* LOGO + TITLE */
    .logo-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin-bottom: 15px;
    }

    .logo-row img {
        width: 48px;
    }

    .logo-text {
        font-size: 28px;
        font-weight: 600;
        color: #1f2937;
    }

    h2 {
        margin-top: 20px;
        margin-bottom: 25px;
        font-size: 16px;
        font-weight: 700;
        color: #111;
    }

    h3 {
        margin-top: -20px;
        margin-bottom: -10px;
        font-size: 16px;
        text-align: left;
        color : #3b4048;
    }

    p {
        margin-top: 20px;
        margin-bottom: 25px;
        font-size: 15px;
        text-align: left;
    }

    a {
        color: #0065ff;
    }

    /* INPUT */
    label {
        display: block;
        text-align: left;
        font-size: 14px;
        font-weight: 600;
        margin-bottom: 6px;
        color: #111;
    }

    input[type="email"] {
        width: 93%;
        padding: 11px 12px;
        border: 1px solid #d3d3d3;
        border-radius: 4px;
        font-size: 15px;
        margin-bottom: 5px;
    }

    .bottom-links {
        margin-top: 20px;
        font-size: 14px;
    }

    .bottom-links a {
        color: #0065ff;
        text-decoration: none;
        margin: 0 5px;
    }

    /* Khu vực điều khoản */
    .extra-links {
        margin-top: 25px;
        text-align: center;
        font-size: 13px;
        color: #6b778c;
    }

    .extra-links img{
        width: 200px;
        height: 70px;
        margin-bottom: -15px;
        margin-top: -25px;
    }

    /* Gạch ngang */
    .separator {
        width: 100%;
        height: 1px;
        background-color: #dfe1e6;
        margin-bottom: 18px;
    }

    /* Dòng recaptcha */
    .recaptcha-text {
        width: 90%;
        margin: 0 auto;
        line-height: 1.5;
    }

    .recaptcha-text div {
        margin-bottom: 10px;
    }

    .recaptcha-text a {
        color: #0065ff;
    }

</style>
</head>
<body>

<div class="login-wrapper">
    <div class="login-box">

        <!-- LOGO -->
        <div class="logo-row">
            <img src="image/logo.png" alt="Logo">
            <div class="logo-text">TodoList</div>
        </div>


        <!-- TITLE -->
        <h2>Can't log in?</h2>

        <p>We sent a recovery link to you at</p>
        <h3 id="emailDisplay"></h3>
        <p>If you haven't received the email, check your spam folder or <a href="{% url 'sign_up' %}">sign up</a></p>

        <!-- BOTTOM LINKS -->
        <div class="bottom-links">
            <a href="{% url 'sign_in' %}">Return to log in</a> <span> | </span> <a href="{% url 'reset_pass' %}">Resend recovery link</a>
        </div>

        <div class="extra-links">
            <div class="separator"></div>

            <img src="image/logo_alassian.png"/>

            <div class="recaptcha-text">
                <div >One account for Trello, Jira, Confluence and
                <a href="https://support.atlassian.com/atlassian-account/docs/what-is-an-atlassian-account/">more.</a>
                </div>

                <div><a href="https://support.atlassian.com/atlassian-account/docs/troubleshoot-login-issues-with-your-atlassian-account/">Login help</a>
                    <span>•</span>
                    <a href="https://support.atlassian.com/">Contact support</a>
                </div>

            </div>
        </div>

    </div>
</div>

<script>
    const params = new URLSearchParams(window.location.search);
    document.getElementById("emailDisplay").innerText = params.get("email");
</script>

</body>
</html>
