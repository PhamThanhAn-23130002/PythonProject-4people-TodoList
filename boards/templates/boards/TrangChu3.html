<!doctype html>
<html lang="vi">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width,initial-scale=1"/>
    <title>Trang chủ – List</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #1f2329; /* nền trang chủ tối */
            --nav: #181c22; /* topbar */
            --panel: #23272f; /* thẻ/panel */
            --panel-2: #2a2f38; /* panel hover/đậm hơn chút */
            --stroke: #2f343c; /* viền mảnh */
            --muted: #a8b0b8; /* chữ phụ */
            --text: #e7ecf0; /* chữ chính */
            --primary: #6ea6ff; /* xanh nút */
            --primary-2: #2b6ef6; /* xanh đậm khi hover */
            --radius: 10px;
        }

        * {
            box-sizing: border-box
        }

        html, body {
            height: 100%
        }

        body {
            margin: 0;
            font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
            color: var(--text);
            background: var(--bg);
        }

        /* TOPBAR */
        .topbar {
            position: fixed;
            inset: 0 0 auto 0;
            height: 56px;
            background: var(--nav);
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 8px 14px;
            z-index: 10;
            box-shadow: 0 1px 0 var(--stroke);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px
        }

        .brand .logo {
            width: 34px;
            height: 33px;
            border-radius: 6px;
            background: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            color: #0b111a;
        }

        .brand span {
            font-weight: 700;
            color: #cfd6dc
        }

        .search {
            flex: 1;
            display: flex;
            align-items: center;
        }

        .search input {
            width: 100%;
            background: #232831;
            border: 1px solid #2e3440;
            border-radius: 8px;
            height: 36px;
            padding: 0 12px;
            color: #cfd6dc;
            outline: none;
        }

        .btn {
            padding: 8px 12px;
            border-radius: 8px;
            background: var(--primary);
            color: #0b111a;
            font-weight: 700;
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 1px 0 rgba(255, 255, 255, 0.06) inset;
            cursor: default;
        }

        .top-actions {
            display: flex;
            align-items: center;
            gap: 12px
        }

        .icon-btn {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            border: 1px solid var(--stroke);
            background: transparent;
            color: #cfd6dc;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
        }

        .avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: #ffb03a;
            color: #141414;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
        }

        /* LAYOUT */
        .shell {
            padding-top: 56px;
            height: 100%;
        }

        .container {
            display: grid;
            grid-template-columns:260px 1fr 320px;
            gap: 24px;
            padding: 24px;
            height: calc(100vh - 56px);
        }

        /* SIDEBAR */
        .sidebar {
            padding-top: 8px
        }

        .nav-group {
            display: flex;
            flex-direction: column;
            gap: 8px
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 10px;
            height: 40px;
            padding: 0 12px;
            border-radius: 8px;
            color: #cfd6dc;
        }

        .nav-item:hover {
            background: #20242b
        }

        .nav-item.active {
            background: #1f2940;
            color: #fff;
            box-shadow: inset 0 0 0 1px #31425d
        }

        .nav-item .glyph {
            width: 20px;
            text-align: center;
            opacity: .9;
        }

        .add-ws {
            margin-top: 12px;
            color: #cfd6dc;
            opacity: .9
        }

        /* MAIN */
        .main {
            display: flex;
            align-items: flex-start;
            justify-content: center
        }


        .hero h2 {
            margin: 6px 0 8px;
            font-weight: 800;
            text-align: center
        }

        .hero p {
            margin: 0 0 14px;
            color: var(--muted);
            text-align: center
        }

        .hero .cta {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .hero .cta .primary {
            background: #5ea1ff;
            border: 1px solid #8ab8ff;
            color: #0b111a;
            padding: 10px 14px;
            border-radius: 8px;
            font-weight: 700;
        }

        .hero .cta a {
            color: #a7c2ff;
            text-decoration: underline
        }


        .recent-info .title {
            font-weight: 600
        }

        .recent-info .meta {
            color: var(--muted);
            font-size: 16px
        }


        .create-tile .plus {
            width: 26px;
            height: 26px;
            border-radius: 6px;
            background: #3b4048;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid var(--stroke);
            font-weight: 800;
        }

        /* ===== HOME CONTENT ===== */
        .main {
            overflow: auto;
        }

        .home {
            padding-top: 8px;
            max-width: 920px;
        }

        .section {
            margin-bottom: 28px;
        }

        .section h3 {
            margin: 0 0 14px;
            font-size: 18px;
            font-weight: 800;
            letter-spacing: .2px;
            display: flex;
            align-items: center;
            gap: 8px;
            color: #e7ecf0;
        }

        .grid {
            display: grid;
            grid-template-columns:repeat(auto-fill, minmax(260px, 1fr));
            gap: 16px;
        }

        /* Board thumbnail card */
        .board-card {
            background: transparent;
            border: none;
        }

        .board-thumb {
            width: 100%;
            height: 110px;
            border-radius: 10px;
            background: linear-gradient(135deg, #a06adf, #f285c8);
            border: 1px solid rgba(255, 255, 255, .15);
        }

        .board-title {
            margin-top: 8px;
            background: #14171c;
            padding: 10px 12px;
            border-radius: 10px;
            font-weight: 700;
        }

        /* Workspace row + texts */
        .ws-row {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 10px 0 12px;
        }

        .ws-badge {
            width: 36px;
            height: 36px;
            border-radius: 8px;
            background: #6ea6ff;
            color: #101418;
            font-weight: 900;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid rgba(255, 255, 255, .15);
        }

        .ws-title {
            font-weight: 800;
        }

        .ws-sub {
            color: #a8b0b8;
        }

        .inline-link {
            color: #8fb1ff;
            text-decoration: underline;
        }

        /* Button "Xem tất cả..." */
        .btn-ghost-xl {
            margin-top: 10px;
            border: 1px solid var(--stroke);
            background: #2b3038;
            color: #d9dee3;
            padding: 10px 14px;
            border-radius: 10px;
            font-weight: 700;
        }

    </style>
</head>
<body>

<!-- TOPBAR -->
<header class="topbar">
    <div class="brand">
        <div class="logo">L</div>
        <span>List</span>
    </div>

    <div class="search">
        <input placeholder="Tìm kiếm" aria-label="Tìm kiếm">
    </div>

    <div class="top-actions">
        <button class="btn">Tạo mới</button>
        <button class="icon-btn" title="Thông báo">🔔</button>
        <button class="icon-btn" title="Trợ giúp">?</button>
        <div class="avatar" title="TT">TT</div>
    </div>
</header>

<div class="shell">
    <div class="container">
        <!-- SIDEBAR -->
        <aside class="sidebar">
            <nav class="nav-group" aria-label="Chính">
                <div class="nav-item active"><span class="glyph">📋</span>Bảng</div>
                <div class="nav-item"><span class="glyph">➜</span>Trang chủ</div>
            </nav>

            <div class="add-ws">+ Tạo Không gian làm việc</div>
        </aside>
        <!-- MAIN -->
        <main class="main">
            <div class="home">

                <!-- Đã xem gần đây -->
                <section class="section">
                    <h3>🕘 Đã xem gần đây</h3>
                    <div class="grid">
                        <article class="board-card">
                            <div class="board-thumb"></div>
                            <div class="board-title">Bảng List của tôi</div>
                        </article>
                    </div>
                </section>

                <!-- Các không gian làm việc của bạn -->
                <section class="section">
                    <h3>CÁC KHÔNG GIAN LÀM VIỆC CỦA BẠN</h3>
                    <div class="ws-sub">
                        Bạn không phải là thành viên của bất kỳ không gian làm việc nào.
                        <a class="inline-link" href="#">Tạo Không gian làm việc</a>
                    </div>
                </section>

                <!-- Các không gian làm việc khách -->
                <section class="section">
                    <h3>CÁC KHÔNG GIAN LÀM VIỆC KHÁCH ℹ️</h3>

                    <div class="ws-row">
                        <div class="ws-badge">T</div>
                        <div>
                            <div class="ws-title">List Không gian làm việc</div>
                        </div>
                    </div>

                    <div class="grid">
                        <article class="board-card">
                            <div class="board-thumb"></div>
                            <div class="board-title">Bảng List của tôi</div>
                        </article>
                    </div>

                    <button class="btn-ghost-xl">Xem tất cả các bảng đã đóng</button>
                </section>

            </div>
        </main>


    </div>
</div>

</body>
</html>
