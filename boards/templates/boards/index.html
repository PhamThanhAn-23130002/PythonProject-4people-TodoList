{% load static %}
{% csrf_token %}
<!doctype html>
<html lang="vi">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width,initial-scale=1"/>
    <title>List - Bảng công việc</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>

<body><div style="position: relative;">
    <button type="button" onclick="toggleTagPopover()">NHÃN</button>

    <div id="tagPopover" class="popover-add-checklist" style="display: none; position: absolute; top: 40px; left: 0; width: 280px; z-index: 9999; background: #fff; border-radius: 3px; box-shadow: 0 8px 16px rgba(0,0,0,0.24); border: 1px solid #dfe1e6;">
        
        <div class="popover-header" style="padding: 10px; border-bottom: 1px solid #dfe1e6; display: flex; justify-content: space-between; align-items: center;">
            <span style="font-weight: bold; color: #5e6c84;">Thêm nhãn mới</span>
            <button type="button" onclick="toggleTagPopover()" style="border:none; background:none; cursor:pointer; color: #5e6c84;">&#10005;</button>
        </div>

        <div class="popover-body" style="padding: 10px;">
            <form id="addTagForm" method="POST" action="">
                {% csrf_token %}
                
                <label style="font-size: 12px; color: #5e6c84; display: block; margin-bottom: 5px;">Tên nhãn</label>
                <input type="text" name="name" placeholder="Ví dụ: Quan trọng..." required style="width: 100%; margin-bottom: 10px; padding: 8px; border: 2px solid #dfe1e6; border-radius: 3px;">
                
                <label style="font-size: 12px; color: #5e6c84; display: block; margin-bottom: 5px;">Chọn màu</label>
                <input type="color" name="color" value="#ff0000" style="width: 100%; height: 40px; border: none; padding: 0; margin-bottom: 15px; cursor: pointer;">
                
                <button type="submit" class="btn-primary" style="width: 100%; padding: 8px; background: #0079bf; color: white; border: none; border-radius: 3px; cursor: pointer; font-weight: bold;">Tạo Nhãn</button>
            </form>
        </div>
    </div>
</div>
</body>

<script>
function toggleTagPopover() {
    const popover = document.getElementById('tagPopover');
    const form = document.getElementById('addTagForm');
    
    // Nếu đang ẩn thì mở lên
    if (popover.style.display === 'none') {
        // 1. Kiểm tra xem có đang chọn thẻ nào không
        if (!currentActiveCard) {
            alert("Lỗi: Không xác định được thẻ đang chọn! (Biến currentActiveCard null)");
            return;
        }

        // 2. Lấy ID từ thẻ HTML (QUAN TRỌNG)
        const cardId = currentActiveCard.getAttribute('data-id'); 
        
        if (cardId) {
            // 3. Cập nhật đường dẫn action cho form
            // Lưu ý: '/tasks/' là prefix của app tasks trong project urls.py
            // Nếu bạn đặt prefix khác thì sửa lại đoạn này nhé.
            form.action = `/tasks/card/${cardId}/add-tag/`;
            
            popover.style.display = 'block';
            
            // Focus vào ô nhập tên
            const nameInput = form.querySelector('input[name="name"]');
            if(nameInput) nameInput.focus();
        } else {
            alert("Lỗi: Thẻ HTML thiếu thuộc tính data-id.");
        }
    } else {
        // Nếu đang mở thì đóng lại
        popover.style.display = 'none';
    }
}
</script>
