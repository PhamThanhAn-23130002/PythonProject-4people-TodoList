                   </div>

                   <select class="priority" name="process">
                    <option  value="">--</option>
                    <option value="">việc cần làm</option>

            </div>
        </div>
        </div>
        <div class="optionchecklist" id="choosedate">
            <input class="chooseday" type="date" name ="inputdate">
            <button type="submit" id="bdate" onclick="date(this)" class="bchooseday">choose</button>
            <button class="x" id=xdate onclick="date(this)">&#10005</button>
        </div>
        <div class="optionchecklist" id="member">
            <input type="text"><br>
            <button class="x" id=xxdate onclick="addmember(this)">&#10005</button>
        </div>
    <Script>
        function date(e){
        if(e.id=="xdate"||e.id=="bdate"){
            document.getElementById("choosedate").style.display = 'none';
            document.getElementById("member").style.display = 'none';
        }else{
        document.getElementById("choosedate").style.display = 'block';
        document.getElementById("member").style.display = 'none';
    }
        }
        function addmember(e){
        if(e.id=="xxdate"){
            document.getElementById("member").style.display = 'none';
        }else {document.getElementById("member").style.display = 'block';
        document.getElementById("choosedate").style.display = 'none';
    }
    }
    </Script>
