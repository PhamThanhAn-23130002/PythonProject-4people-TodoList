{% load static %}
<!doctype html>
<html lang="vi">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width,initial-scale=1"/>
    <title>List - Bảng công việc</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            /* màu chung */
            --bg-start: #6b2f86;
            --bg-end: #a64f86;
            --nav: #181c22;
            --stroke: #2f343c;
            --muted: #a8b0b8;
            --text: #e7ecf0;

            /* layout heights */
            --topbar: 56px; /* thanh trên cùng */
            --boardbar: 52px; /* dải tiêu đề board */
            --footer: 48px; /* footer nổi phía dưới */
        }

        * {
            box-sizing: border-box
        }

        html, body {
            height: 100%
        }

        body {
            margin: 0;
            font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
            color: var(--text);
            background: linear-gradient(180deg, var(--bg-start), var(--bg-end));
            overflow: hidden; /* ngăn body kéo dọc; phần cuộn ở .board-wrap */
        }

        /* ===== TOPBAR  ===== */
        .topbar {
            position: fixed;
            inset: 0 0 auto 0;
            height: var(--topbar);
            background: var(--nav);
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 8px 14px;
            z-index: 10;
            box-shadow: 0 1px 0 var(--stroke);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px
        }

        .brand .logo {
            width: 34px;
            height: 34px;
            border-radius: 6px;
            background: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            color: #111;
        }

        .brand span {
            font-weight: 700;
            color: #cfd6dc
        }

        .search {
            flex: 1;
            display: flex;
            align-items: center
        }

        .search input {
            width: 100%;
            background: #232831;
            border: 1px solid #2e3440;
            border-radius: 8px;
            height: 36px;
            padding: 0 12px;
            color: #cfd6dc;
            outline: none;
        }

        .top-actions {
            display: flex;
            align-items: center;
            gap: 12px
        }

        .btn {
            padding: 8px 12px;
            border-radius: 8px;
            background: #6ea6ff;
            color: #0b111a;
            font-weight: 700;
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 1px 0 rgba(255, 255, 255, 0.06) inset;
            cursor: default;
        }

        .icon-btn {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            border: 1px solid var(--stroke);
            background: transparent;
            color: #cfd6dc;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
        }

        .avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: #ffb03a;
            color: #141414;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
        }

        /* ===== DẢI TIÊU ĐỀ BOARD ===== */
        .board-bar {
            margin-top: var(--topbar);
            height: var(--boardbar);
            width: 100%;
            box-sizing: border-box;
            background: #483467;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            gap: 12px;
            box-shadow: 0 1px 0 rgba(0, 0, 0, 0.15);
        }

        .board-title {
            font-weight: 800;
            font-size: 18px
        }

        .board-actions {
            display: flex;
            align-items: center;
            gap: 8px
        }

        .share-btn {
            background: #d9d9e3;
            color: #000;
            font-weight: 700;
            border-radius: 6px;
            padding: 6px 12px;
            border: none;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .more-btn {
            width: 32px;
            height: 32px;
            border-radius: 6px;
            border: 1px solid #c5c5d3;
            background: transparent;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
        }

        /* ===== NỘI DUNG BOARD (cuộn trong khung) ===== */
        .board-wrap {
            height: calc(100vh - var(--topbar) - var(--boardbar) - var(--footer));
            overflow: auto;
            padding: 20px;
        }

        .lists {
            display: flex;
            gap: 18px;
            align-items: flex-start;
            min-width: 100%
        }

        .add-list {
            width: 280px;
            padding: 12px;
            display: flex;
            align-items: center;
            justify-content: flex-start;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 14px;
            color: #f5f6f7;
            flex-shrink: 0;
            border: 1px solid rgba(255, 255, 255, 0.12);
        }

        /* ===== FOOTER NỔI ===== */
        .floating-footer {
            position: fixed;
            left: 50%;
            transform: translateX(-50%);
            bottom: 12px;
            height: var(--footer);
            background: rgba(0, 0, 0, 0.6);
            padding: 10px 18px;
            border-radius: 28px;
            font-weight: 600;
            color: #a8b0b8;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.45);
            display: flex;
            gap: 12px;
            align-items: center;
            z-index: 11;
        }


        /* ===== ACCOUNT MENU ===== */
        .account-wrap {
            position: relative;
        }

        .account-menu {
            position: absolute;
            top: 44px;
            right: 0;
            width: 300px;
            background: #2b2f36;
            border-radius: 12px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, .5);
            padding: 12px 0;
            display: none;
            z-index: 1000;
        }

        .account-menu.show {
            display: block;
        }

        .menu-section {
            padding: 0 16px;
        }

        .menu-title {
            font-size: 12px;
            font-weight: 700;
            color: #9aa3ad;
            margin-bottom: 8px;
        }

        .account-info {
            display: flex;
            gap: 12px;
            align-items: center;
            padding: 8px 0;
            cursor: pointer;

        }

        .account-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: #ffb03a;
            color: #141414;
            font-weight: 800;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;

        }

        .account-name {
            font-weight: 700;
        }

        .account-email {
            font-size: 13px;
            color: #a8b0b8;
        }

        .menu-divider {
            height: 1px;
            background: #3a3f47;
            margin: 10px 0;
        }

        .menu-item {
            padding: 10px 16px;
            cursor: pointer;
            color: #e7ecf0;
            font-size: 14px;
        }

        .menu-item:hover {
            background: #3a3f47;
        }

        .menu-item.logout {
            color: #ff8b8b;
            font-weight: 600;
        }

    </style>


</head>
<body>

<!-- TOPBAR -->
<header class="topbar">
    <div class="brand">
        <div class="logo">L</div>
        <span>List</span>
    </div>
    <div class="search"><input placeholder="Tìm kiếm" aria-label="Tìm kiếm"></div>
    <div class="top-actions">
        <button class="btn">Tạo mới</button>
        <button class="icon-btn" title="Thông báo">🔔</button>
        <button class="icon-btn" title="Trợ giúp">?</button>

        <div class="account-wrap">
            <div class="avatar" id="accountBtn">TT</div>

            <div class="account-menu" id="accountMenu">
                <!-- TÀI KHOẢN -->
                <div class="menu-section">
                    <div class="menu-title">TÀI KHOẢN</div>
                    <div class="account-info">
                        <div class="account-avatar">TT</div>
                        <div>
                            <div class="account-name">Tran Anh Tuan</div>
                            <div class="account-email">23130372@st.hcmuaf.edu.vn</div>
                        </div>
                    </div>
                </div>

                <div class="menu-divider"></div>

                <!-- TRELLO -->
                <div class="menu-section">
                    <div class="menu-title">LIST</div>

                    <div class="menu-item">Chuyển đổi tài khoản</div>
                    <div class="menu-item">Quản lý tài khoản</div>

                    <div class="menu-item">Hồ sơ và Hiển thị</div>
                    <div class="menu-item">Cài đặt</div>
                </div>

                <div class="menu-divider"></div>

                <!-- ĐĂNG XUẤT -->
                <div class="menu-item logout">Đăng xuất</div>
            </div>
        </div>


    </div>
</header>

<!-- Dải tiêu đề của Board -->
<div class="board-bar">
    <div class="board-title">Bảng List của tôi</div>
    <div class="board-actions">
        <button class="share-btn">👥 Chia sẻ</button>
        <button class="more-btn">⋯</button>
    </div>
</div>

<!-- Nội dung board (cuộn trong khung này) -->
<main class="board-wrap" role="main">
    <div class="lists" role="list">
        <div class="add-list" role="button" aria-label="Thêm danh sách">+ Thêm danh sách khác</div>
    </div>
</main>

<!-- Footer nổi -->
<div class="floating-footer">
    📅 Bảng thông tin &nbsp;&nbsp;|&nbsp;&nbsp; Chuyển đổi các trang
</div>

</body>


<script>
    const btn = document.getElementById('accountBtn');
    const menu = document.getElementById('accountMenu');

    btn.addEventListener('click', (e) => {
        e.stopPropagation();
        menu.classList.toggle('show');
    });

    document.addEventListener('click', () => {
        menu.classList.remove('show');
    });
</script>

</html>
